# akernel security scanning (docs/SCANNING.md is the ledger).
#
# Jobs:
#   deps     — supply chain: sha256 pin enforcement, SBOM freshness,
#              osv-scanner CVE watch over the committed SBOM.
#   secrets  — gitleaks over full history + the working tree.
#   ada-sast — GNATprove flow/proof on the capability/IPC core (Phase 3).
#   host     — bandit on tools/*.py, shellcheck on shell recipes (Phase 4).
#
# Run on every push / pull request, plus a weekly scheduled run so the
# CVE watch and the GNATprove baselines refresh on their own.

name: security

on:
  push:
  pull_request:
  schedule:
    # Weekly Monday 03:17 UTC CVE/advisory watch.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  deps:
    name: Supply chain (pins, SBOM, CVE watch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Fetch pinned third-party tarballs
        run: make fetch-pins

      - name: Pin enforcement (tools/check_pins.py)
        run: python3 tools/check_pins.py

      - name: SBOM is current (tools/gen_sbom.py --check)
        run: python3 tools/gen_sbom.py --check

      - name: Install osv-scanner (pinned v2.5.1)
        run: |
          curl -sL --fail --max-time 120 -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner

      - name: CVE scan over committed SBOM
        run: |
          /tmp/osv-scanner scan source -L docs/sbom/akernel.spdx.json \
            --format json --output-file /tmp/osv.json
          python3 tools/osv_gate.py /tmp/osv.json

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history — the repo is small (332 commits)

      - name: Install gitleaks (pinned 8.30.1)
        run: |
          curl -sL --fail --max-time 120 -o /tmp/gl.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf /tmp/gl.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      # Full-history scan (covers every push/PR commit; a diff-only scan
      # can replace this if the repo outgrows the ~18 MB full pass) plus
      # a working-tree scan for uncommitted additions in PR runs.
      - name: Scan full history
        run: |
          /tmp/gitleaks git --log-opts=--all --config .gitleaks.toml \
            --redact=100 --report-format json --report-path /tmp/gl_git.json
          python3 tools/gl_gate.py /tmp/gl_git.json

      - name: Scan working tree
        run: |
          /tmp/gitleaks dir --config .gitleaks.toml \
            --redact=100 --report-format json --report-path /tmp/gl_dir.json .
          python3 tools/gl_gate.py /tmp/gl_dir.json

  ada-sast:
    name: Ada/SPARK proof (GNATprove)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # GitHub runners do not ship Alire. Pin the v2.1.1 release binary
      # (sha256-checked like every other fetched artifact in this repo).
      - name: Install Alire (pinned v2.1.1)
        run: |
          curl -sL --fail --max-time 180 -o /tmp/alr.zip \
            https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  /tmp/alr.zip" | sha256sum -c -
          unzip -o -q /tmp/alr.zip -d /tmp/alr-bin
          sudo install -m 0755 /tmp/alr-bin/bin/alr /usr/local/bin/alr
          alr version

      # Analysis toolchain pinned to the project's own 15.3.1 line: the
      # custom RTS does not compile on GNAT 16 (no upgrade yet), and
      # gnatprove must version-match its compiler. The index has no
      # gnatprove 15.3.1, so use gnatprove 15.1.0 — verified compatible
      # with gnat_riscv64_elf 15.3.1 (16/16 checks proved, see ledger).
      # gprbuild is also a toolchain component a fresh runner lacks.
      # Cache the installs so weekly runs don't re-download ~1 GB.
      - name: Cache Alire toolchains
        env:
          ALR_CACHE_SLOT: alr-2.1.1-gnat-15.3.1-gnatprove-15.1.0-gprbuild-26.0.1
        uses: actions/cache@v5
        with:
          path: |
            ~/.alire
            ~/.config/alire
          key: ${{ env.ALR_CACHE_SLOT }}

      - name: Install GNATprove + toolchain components (alr)
        run: |
          alr install gnatprove=15.1.0
          alr install gnat_riscv64_elf=15.3.1
          alr install gprbuild=26.0.1
          # Register both components as the default toolchain so
          # gnatprove's knowledge base resolves riscv64-elf/light-rv64imafdc
          # and gprbuild drives the compile phase.
          alr toolchain --select gnat_riscv64_elf=15.3.1
          alr toolchain --select gprbuild=26.0.1

      # config/akernel_config.{ads,gpr,h} are Alire-generated and
      # gitignored, so a fresh checkout has none and akernel.gpr cannot
      # compile. `alr update` (solve only — no compiler download, no
      # build) regenerates them; this is why gnatprove needs no make.
      - name: Generate Alire config artifacts
        run: alr --non-interactive update

      # Whole-project analysis; the SPARK surface today is the
      # Kernel.Capabilities pure-logic subset. gnatprove exits 0 with
      # unproved checks (recorded as audit entries, not failures);
      # errors/failed checks exit non-zero and fail the job. The alr bin
      # dir is put on PATH so gprconfig finds the cross compiler; no
      # crate solve is needed (that is why this is not `alr exec`).
      # --warnings=off: gnatprove re-enables the .x warning class its
      # analysis compiles (CE may call Last_Chance_Handler) that the
      # kernel build suppresses via -gnatw.X — expected noise from the
      # syscall dispatcher's range conversions, not proof failures.
      - name: GNATprove proof baseline
        run: |
          ALR_BIN="$(dirname "$(find "$HOME/.alire" -name riscv64-elf-gcc -path '*/bin/*' 2>/dev/null | head -1)")"
          test -n "$ALR_BIN" || { echo "alr toolchain bin not found"; exit 1; }
          export PATH="$ALR_BIN:$PATH"
          gnatprove -P akernel.gpr -f --mode=prove --level=1 \
            --timeout=30 --report=all --warnings=off
          tail -40 obj/development/riscv64/qemu_virt_riscv64/gnatprove/gnatprove.out

  host:
    name: Host tooling lint (bandit + py_compile)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Python syntax check (all host tools)
        run: python3 -m py_compile tools/*.py

      - name: bandit over tools/ (medium+; Lows accepted — see docs/SCANNING.md)
        run: |
          python3 -m pip install --quiet bandit
          python3 -m bandit -q -ll -r tools

      # shellcheck: no *.sh / *.bash files are tracked today, so the
      # pass is conditional. Makefile recipe verification is structural
      # (tools/check_pins.py). Re-enable when real shell scripts land.
      - name: shellcheck (conditional)
        run: |
          if git ls-files '*.sh' '*.bash' | grep -q .; then
            echo "shell scripts found — add a pinned shellcheck step here"
            exit 1
          fi
          echo "no tracked shell scripts — shellcheck pass N/A"
